steps:
  # -----------------------------------------------------------------
  # Detail-Collector 배포
  # -----------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Prepare-Detail-Collector'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        mkdir -p /workspace/deploy_detail_collector
        cp -r ./function_5_detail_collector/. /workspace/deploy_detail_collector/
        cp -r ./libs/. /workspace/deploy_detail_collector/libs/
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy-Detail-Collector'
    args: [ 'functions', 'deploy', 'github-detail-collector', '--gen2', '--runtime=python311', '--region=asia-northeast3', '--source=/workspace/deploy_detail_collector', '--entry-point=run', '--trigger-http', '--no-allow-unauthenticated', '--service-account=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com', '--set-env-vars-from-file=.env' ]
    waitFor: ['Prepare-Detail-Collector']

  # -----------------------------------------------------------------
  # Transformer 배포
  # -----------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy-Transformer'
    args: [ 'functions', 'deploy', 'github-data-transformer', '--gen2', '--runtime=python311', '--region=asia-northeast3', '--source=./function_3_transformer', '--entry-point=run', '--trigger-resource=bcsd-github-analytics-data', '--trigger-event=google.storage.object.finalize', '--service-account=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com', '--set-env-vars-from-file=.env' ]

  # -----------------------------------------------------------------
  # Webhook Handler 배포
  # -----------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Prepare-Webhook-Handler'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        mkdir -p /workspace/deploy_webhook_handler
        cp -r ./function_4_webhook_handler/. /workspace/deploy_webhook_handler/
        cp -r ./libs/. /workspace/deploy_webhook_handler/libs/
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy-Webhook-Handler'
    args: [ 'functions', 'deploy', 'github-webhook-handler', '--gen2', '--runtime=python311', '--region=asia-northeast3', '--source=/workspace/deploy_webhook_handler', '--entry-point=run', '--trigger-http', '--allow-unauthenticated', '--service-account=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com', '--set-env-vars-from-file=.env' ]
    waitFor: ['Prepare-Webhook-Handler']

  # -----------------------------------------------------------------
  # Worker(PR-Lister) 배포
  # -----------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Prepare-Worker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        mkdir -p /workspace/deploy_worker
        cp -r ./function_2_worker/. /workspace/deploy_worker/
        cp -r ./libs/. /workspace/deploy_worker/libs/
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy-Worker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        DETAIL_COLLECTOR_URL=$$(gcloud functions describe github-detail-collector --region=asia-northeast3 --gen2 --format='value(serviceConfig.uri)') && \
        gcloud functions deploy github-pr-collector-worker \
          --gen2 --runtime=python311 --region=asia-northeast3 \
          --source=/workspace/deploy_worker --entry-point=run \
          --trigger-http --no-allow-unauthenticated \
          --service-account=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com \
          --set-env-vars="DETAIL_COLLECTOR_FUNCTION_URL=$$DETAIL_COLLECTOR_URL,$(cat .env | tr '\n' ',' | sed 's/,$//')"
    waitFor: ['Deploy-Detail-Collector', 'Prepare-Worker']

  # -----------------------------------------------------------------
  # Dispatcher 함수 배포
  # -----------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Prepare-Dispatcher'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        mkdir -p /workspace/deploy_dispatcher
        cp -r ./function_1_dispatcher/. /workspace/deploy_dispatcher/
        cp -r ./libs/. /workspace/deploy_dispatcher/libs/
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy-Dispatcher'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        WORKER_URL=$$(gcloud functions describe github-pr-collector-worker --region=asia-northeast3 --gen2 --format='value(serviceConfig.uri)') && \
        gcloud functions deploy github-repo-dispatcher \
          --gen2 --runtime=python311 --region=asia-northeast3 \
          --source=/workspace/deploy_dispatcher --entry-point=run \
          --trigger-topic=github-collection-scheduler \
          --service-account=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com \
          --set-env-vars="WORKER_FUNCTION_URL=$$WORKER_URL,$(cat .env | tr '\n' ',' | sed 's/,$//')"
    waitFor: ['Deploy-Worker', 'Prepare-Dispatcher']

# 타임아웃 및 로깅 옵션
timeout: 1800s
options:
  logging: 'CLOUD_LOGGING_ONLY'