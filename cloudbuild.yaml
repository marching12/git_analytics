steps:
  # -----------------------------------------------------------------
  # 1. Worker 함수 1차 배포 (URL 생성 목적)
  # -----------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy-Worker-Initial'
    args:
      - 'functions'
      - 'deploy'
      - 'github-pr-collector-worker'
      - '--gen2'
      - '--runtime=python311'
      - '--region=asia-northeast3'
      - '--source=./function_2_worker'
      - '--entry-point=run'
      - '--trigger-http'
      - '--no-allow-unauthenticated'
      - '--service-account=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com'
      - '--set-env-vars=GCP_PROJECT_ID=bcsd-github,REPO_OWNER=BCSDLab,GCS_BUCKET_NAME=bcsd-github-analytics-data,SECRET_ID=kong-pta,BIGQUERY_DATASET_ID=github_analytics,LABEL_MAPPING_TABLE_NAME=label_team_mapping,COMMON_TEAM_ID=4'

  # -----------------------------------------------------------------
  # 2. Worker 함수 2차 배포 (최종)
  # -----------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy-Worker-Final'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        WORKER_URL=$$(gcloud functions describe github-pr-collector-worker --region=asia-northeast3 --gen2 --format='value(serviceConfig.uri)') && \
        gcloud functions deploy github-pr-collector-worker \
          --gen2 --runtime=python311 --region=asia-northeast3 \
          --source=./function_2_worker --entry-point=run \
          --trigger-http --no-allow-unauthenticated \
          --service-account=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com \
          --set-env-vars="WORKER_FUNCTION_URL=$$WORKER_URL,GCP_PROJECT_ID=bcsd-github,REPO_OWNER=BCSDLab,GCS_BUCKET_NAME=bcsd-github-analytics-data,SECRET_ID=kong-pta,BIGQUERY_DATASET_ID=github_analytics,LABEL_MAPPING_TABLE_NAME=label_team_mapping,COMMON_TEAM_ID=4"
    waitFor: ['Deploy-Worker-Initial']

  # -----------------------------------------------------------------
  # 3. 다른 함수들 배포 (Worker 최종 배포 후 병렬 실행)
  # -----------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy-Transformer'
    args:
      - 'functions'
      - 'deploy'
      - 'github-data-transformer'
      - '--gen2'
      - '--runtime=python311'
      - '--region=asia-northeast3'
      - '--source=./function_3_transformer'
      - '--entry-point=run'
      - '--trigger-resource=bcsd-github-analytics-data'
      - '--trigger-event=google.storage.object.finalize'
      - '--service-account=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com'
      - '--set-env-vars=GCP_PROJECT_ID=bcsd-github,BIGQUERY_DATASET_ID=github_analytics'
    waitFor: ['Deploy-Worker-Final']

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy-Webhook-Handler'
    args:
      - 'functions'
      - 'deploy'
      - 'github-webhook-handler'
      - '--gen2'
      - '--runtime=python311'
      - '--region=asia-northeast3'
      - '--source=./function_4_webhook_handler'
      - '--entry-point=run'
      - '--trigger-http'
      - '--allow-unauthenticated'
      - '--service-account=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com'
      - '--set-env-vars=GCP_PROJECT_ID=bcsd-github,GCS_BUCKET_NAME=bcsd-github-analytics-data,WEBHOOK_SECRET_ID=github-webhook-secret,REPO_OWNER=BCSDLab,SECRET_ID=kong-pta,BIGQUERY_DATASET_ID=github_analytics,LABEL_MAPPING_TABLE_NAME=label_team_mapping'
    waitFor: ['Deploy-Worker-Final']

  # -----------------------------------------------------------------
  # 4. Dispatcher 함수 배포 (Worker 최종 배포 후 실행)
  # ----------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy-Dispatcher'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        WORKER_URL=$$(gcloud functions describe github-pr-collector-worker --region=asia-northeast3 --gen2 --format='value(serviceConfig.uri)') && \
        gcloud functions deploy github-repo-dispatcher \
          --gen2 --runtime=python311 --region=asia-northeast3 \
          --source=./function_1_dispatcher --entry-point=run \
          --trigger-topic=github-collection-scheduler \
          --service-account=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com \
          --set-env-vars="BATCH_START_DATE=2023-01-01,GCP_PROJECT_ID=bcsd-github,GCP_REGION=asia-northeast3,REPO_OWNER=BCSDLab,SECRET_ID=kong-pta,TASK_QUEUE_ID=github-collector-queue-2,WORKER_FUNCTION_URL=$$WORKER_URL,WORKER_SERVICE_ACCOUNT=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com,BIGQUERY_DATASET_ID=github_analytics,TARGET_REPO_TABLE=repositories"
    waitFor: [ 'Deploy-Worker-Final' ]

# 타임아웃 및 로깅 옵션
timeout: 1800s
options:
  logging: 'CLOUD_LOGGING_ONLY'