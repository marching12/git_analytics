steps:
  # -----------------------------------------------------------------
  # 1. 의존성이 없는 함수들을 먼저 배포합니다.
  # -----------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy-Detail-Collector'
    args: [ 'functions', 'deploy', 'github-detail-collector', '--gen2', '--runtime=python311', '--region=asia-northeast3', '--source=./function_5_detail_collector', '--entry-point=run', '--trigger-http', '--no-allow-unauthenticated', '--service-account=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com', '--set-env-vars=GCP_PROJECT_ID=bcsd-github,REPO_OWNER=BCSDLab,GCS_BUCKET_NAME=bcsd-github-analytics-data,SECRET_ID=bcsd-github-analytics-pta,BIGQUERY_DATASET_ID=github_analytics,LABEL_MAPPING_TABLE_NAME=label_team_mapping,COMMON_TEAM_ID=4' ]

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy-Transformer'
    args: [ 'functions', 'deploy', 'github-data-transformer', '--gen2', '--runtime=python311', '--region=asia-northeast3', '--source=./function_3_transformer', '--entry-point=run', '--trigger-resource=bcsd-github-analytics-data', '--trigger-event=google.storage.object.finalize', '--service-account=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com', '--set-env-vars=GCP_PROJECT_ID=bcsd-github,BIGQUERY_DATASET_ID=github_analytics' ]

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy-Webhook-Handler'
    args: [ 'functions', 'deploy', 'github-webhook-handler', '--gen2', '--runtime=python311', '--region=asia-northeast3', '--source=./function_4_webhook_handler', '--entry-point=run', '--trigger-http', '--allow-unauthenticated', '--service-account=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com', '--set-env-vars=GCP_PROJECT_ID=bcsd-github,GCS_BUCKET_NAME=bcsd-github-analytics-data,WEBHOOK_SECRET_ID=github-webhook-secret,REPO_OWNER=BCSDLab,SECRET_ID=bcsd-github-analytics-pta,BIGQUERY_DATASET_ID=github_analytics,LABEL_MAPPING_TABLE_NAME=label_team_mapping' ]

  # -----------------------------------------------------------------
  # 2. Worker(PR-Lister) 배포
  # Detail-Collector가 먼저 배포되어야 URL을 가져올 수 있습니다.
  # -----------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy-Worker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        DETAIL_COLLECTOR_URL=$$(gcloud functions describe github-detail-collector --region=asia-northeast3 --gen2 --format='value(serviceConfig.uri)') && \
        gcloud functions deploy github-pr-collector-worker \
          --gen2 --runtime=python311 --region=asia-northeast3 \
          --source=./function_2_worker --entry-point=run \
          --trigger-http --no-allow-unauthenticated \
          --service-account=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com \
          --set-env-vars="GCP_PROJECT_ID=bcsd-github,GCP_REGION=asia-northeast3,REPO_OWNER=BCSDLab,SECRET_ID=bcsd-github-analytics-pta,DETAIL_COLLECTOR_QUEUE_ID=github-detail-collector-queue,DETAIL_COLLECTOR_FUNCTION_URL=$$DETAIL_COLLECTOR_URL,WORKER_SERVICE_ACCOUNT=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com"
    waitFor: ['Deploy-Detail-Collector']

  # -----------------------------------------------------------------
  # 3. Dispatcher 함수 배포
  # Worker가 배포되어야 URL을 가져올 수 있습니다.
  # -----------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy-Dispatcher'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        WORKER_URL=$$(gcloud functions describe github-pr-collector-worker --region=asia-northeast3 --gen2 --format='value(serviceConfig.uri)') && \
        gcloud functions deploy github-repo-dispatcher \
          --gen2 --runtime=python311 --region=asia-northeast3 \
          --source=./function_1_dispatcher --entry-point=run \
          --trigger-topic=github-collection-scheduler \
          --service-account=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com \
          --set-env-vars="GCP_PROJECT_ID=bcsd-github,GCP_REGION=asia-northeast3,REPO_OWNER=BCSDLab,SECRET_ID=bcsd-github-analytics-pta,TASK_QUEUE_ID=github-collector-queue-2,WORKER_FUNCTION_URL=$$WORKER_URL,WORKER_SERVICE_ACCOUNT=bcsd-github-analytics-debug@bcsd-github.iam.gserviceaccount.com,BIGQUERY_DATASET_ID=github_analytics,TARGET_REPO_TABLE=repositories"
    waitFor: ['Deploy-Worker']

# 타임아웃 및 로깅 옵션
timeout: 1800s
options:
  logging: 'CLOUD_LOGGING_ONLY'